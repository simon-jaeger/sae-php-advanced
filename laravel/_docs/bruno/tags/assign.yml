info:
  name: assign
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/tags/assign"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "article_id": 1,
        "tag_ids": [1,2]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
